function validateData(raw){
 if(!raw||raw.version!==1||!raw.settings||!Array.isArray(raw.products))throw Error('El archivo no es una copia de Brava válida.');
 const d=JSON.parse(JSON.stringify(raw)),s=d.settings;const numeric=(x,min,max)=>typeof x==='number'&&Number.isFinite(x)&&x>=min&&x<=max;
 if(!numeric(s.discount,0,100)||!numeric(s.surcharge,0,1000)||!Number.isInteger(s.installments)||s.installments<1||s.installments>24)throw Error('Revisá los valores de cuotas y descuentos.');
 if(!Array.isArray(s.deliveries)||!s.deliveries.some(x=>x.enabled))throw Error('Activá al menos una forma de entrega.');
 const deliveryIds=new Set();for(const x of s.deliveries){if(!x.id||deliveryIds.has(x.id)||!String(x.name||'').trim()||(x.fee!==null&&!numeric(x.fee,0,1e12)))throw Error('Revisá las opciones de entrega.');deliveryIds.add(x.id);}
 const ids=new Set();for(const p of d.products){if(!p.id||ids.has(p.id)||!String(p.name||'').trim()||!numeric(p.price,0,1e12))throw Error('Revisá los nombres y precios de los muebles.');ids.add(p.id);if(p.transferPrice!==null&&p.transferPrice!==''&&p.transferPrice!==undefined&&(!numeric(p.transferPrice,0,p.price)))throw Error('El precio por transferencia debe estar entre cero y el precio de lista.');if(!Array.isArray(p.finishes)||!p.finishes.length)throw Error('Cada mueble necesita al menos una terminación.');p.active=p.active!==false;}
 return d;
}

h="200"></label><label class="check"><input name="active" type="checkbox" '+(p.active?'checked':'')+'>Mostrar en el catálogo</label></div><div class="admin-save"><button class="button" type="submit">Guardar mueble '+icon('check')+'</button></div></form>';

function deliveryEditor(d,i){return '<div class="delivery-edit" data-delivery="'+i+'"><div class="delivery-top"><label class="check"><input type="checkbox" name="delivery_enabled_'+i+'" '+(d.enabled?'checked':'')+'>Opción activa</label><button type="button" class="copy-btn" data-action="delete-delivery" data-index="'+i+'">Eliminar opción</button></div><div class="fields">'+field('Nombre de la opción','delivery_name_'+i,d.name,'text','required maxlength="100"')+'<label class="field">Costo ($)<input name="delivery_fee_'+i+'" type="number" min="0" max="1000000000000" step="0.01" value="'+esc(d.fee??'')+'" placeholder="A coordinar"><small>Vacío = a coordinar. 0 = sin cargo.</small></label>'+field('Aclaración para el cliente','delivery_description_'+i,d.description,'text','maxlength="250"')+'<label class="check"><input name="delivery_address_'+i+'" type="checkbox" '+(d.address?'checked':'')+'>Pedir dirección de entrega</label></div></div>';}
function renderSettings(){
 const s=data.settings;
 $('#admin-content').innerHTML='<form id="settings-form"><div class="settings-grid"><section class="panel"><div class="panel-title"><div><h2>Contacto y transferencia</h2><p>El destino de los pedidos y los datos para transferir.</p></div></div><div class="fields"><label class="field full">WhatsApp de Brava<input name="whatsapp" type="tel" value="'+esc(s.whatsapp)+'" placeholder="549 + código de área + número" maxlength="25"><small>Formato internacional. Sin 0 ni 15. Dejalo vacío para usar solo la copia del pedido.</small></label><label class="field full">Alias de transferencia<input name="alias" value="'+esc(s.alias)+'" maxlength="100" placeholder="Tu alias bancario"></label><label class="field full">Titular de la cuenta<input name="accountName" value="'+esc(s.accountName)+'" maxlength="150"></label></div></section><section class="panel"><div class="panel-title"><div><h2>Precios y cuotas</h2><p>Se aplican automáticamente al catálogo y al pedido.</p></div></div><div class="fields">'+field('Cantidad de cuotas','installments',s.installments,'number','min="1" max="24" step="1" required')+field('Recargo con tarjeta (%)','surcharge',s.surcharge,'number','min="0" max="1000" step="0.01" required')+'<label class="field full">Descuento por transferencia (%)<input name="discount" value="'+s.discount+'" type="number" min="0" max="100" step="0.01" required><small>Se calcula sobre el precio de lista. Cada mueble puede tener su propio precio por transferencia.</small></label><label class="check full"><input name="example" type="checkbox" '+(s.example?'checked':'')+'>Mostrar aviso de catálogo de muestra</label></div></section><section class="panel full-panel"><div class="panel-title"><div><h2>Métodos de entrega</h2><p>Podés agregar retiro, envío local, transporte u otras opciones.</p></div><button type="button" class="button light small" data-action="add-delivery">'+icon('plus')+'Agregar</button></div>'+s.deliveries.map(deliveryEditor).join('')+'</section></div><div class="admin-save"><button class="button" type="submit">Guardar configuración '+icon('check')+'</button></div></form>';
}
function readSettings(){
 const f=$('#settings-form');if(!f)return structuredClone(data.settings);const v=new FormData(f),s=structuredClone(data.settings);
 for(const k of ['whatsapp','alias','accountName'])s[k]=String(v.get(k)||'').trim();s.whatsapp=s.whatsapp.replace(/\D/g,'');
 if(s.whatsapp&&!whatsappUrl(s.whatsapp,''))throw Error('Revisá el número de WhatsApp: entre 8 y 15 dígitos, con país y código de área.');
 for(const k of ['installments','surcharge','discount'])s[k]=Number(v.get(k));s.example=v.has('example');
 s.deliveries=s.deliveries.map((d,i)=>({...d,name:String(v.get('delivery_name_'+i)||'').trim(),description:String(v.get('delivery_description_'+i)||'').trim(),enabled:v.has('delivery_enabled_'+i),address:v.has('delivery_address_'+i),fee:v.get('delivery_fee_'+i)===''?null:Number(v.get('delivery_fee_'+i))}));
 return s;
}
function renderPublish(){
 $('#admin-content').innerHTML='<div class="publish-grid"><section class="panel"><span class="eyebrow">01 / TU TIENDA</span><h3>Lista para compartir.</h3><p>Descargá un index.html con tu catálogo, fotos, precios y configuración incluidos. Es el archivo que tenés que subir a tu hosting.</p><button class="button" data-action="download-store">Descargar tienda '+icon('download')+'</button></section><section class="panel"><span class="eyebrow">02 / TUS DATOS</span><h3>Una copia, siempre.</h3><p>Guardá una copia JSON de tu catálogo. Te permite recuperar los datos o seguir trabajando desde otro navegador o computadora.</p><button class="button light" data-action="backup">Descargar copia JSON '+icon('download')+'</button></section><section class="panel"><span class="eyebrow">03 / CONTINUAR</span><h3>Recuperá tu colección.</h3><p>Importá una copia JSON de Brava. Reemplaza el catálogo y la configuración de este navegador. Tu tienda publicada no se modifica.</p><label class="field">Seleccionar copia de Brava<input id="import-file" type="file" accept=".json,application/json"></label></section><section class="panel"><span class="eyebrow">04 / TU EDITOR</span><h3>El taller va con vos.</h3><p>Descargá el administrador con tus datos actuales. Abrilo en tu computadora para seguir editando y exportando tu tienda.</p><button class="button light" data-action="download-admin">Descargar administrador '+icon('download')+'</button></section></div><div class="export-help"><strong>Para actualizar la web:</strong><br>1. Guardá los cambios en Catálogo o Pagos y entrega.<br>2. Descargá una copia JSON como respaldo.<br>3. Descargá la tienda y reemplazá el index.html en tu hosting.<br>4. Abrí la página publicada y revisá el catálogo.<br><br>El administrador no tiene contraseña ni almacena pedidos. Los datos de edición se guardan en tu navegador; los pedidos se coordinan por WhatsApp. Guardá el editor en tu computadora.</div>';
}
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('Descarga preparada: '+name);}
function exportHtml(mode){
 validateData(data);
 const json=JSON.stringify(data).replace(/</g,'\\u003c');
 return TEMPLATE.replace(/<body data-mode="(?:admin|store)">/,'<body data-mode="'+mode+'">').replace(/<script id="brava-data" type="application\/json">[\s\S]*?<\/script>/,()=>'<script id="brava-data" type="application/json">'+json+'</scr'+'ipt>');
}
function ensureSaved(){if(!dirty)return true;toast('Guardá la configuración antes de continuar.');$('#settings-form')?.scrollIntoView({behavior:'smooth'});return false;}
async function processPhoto(file){
 if(!file)return;if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw Error('Elegí una imagen JPG, PNG o WebP.');if(file.size>20*1024*1024)throw Error('La imagen supera los 20 MB. Elegí una más pequeña.');
 const src=URL.createObjectURL(file);try{const im=new Image();im.src=src;await im.decode();const c=document.createElement('canvas'),ratio=Math.min(1,1400/Math.max(im.width,im.height));c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);const ctx=c.getContext('2d');ctx.fillStyle='#f7f5f0';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);uploadImage=c.toDataURL('image/jpeg',.84);$('#upload-preview').innerHTML=photo({name:'Foto del mueble',image:uploadImage},'',false);toast('Foto lista. Guardá el mueble para conservarla.');}finally{URL.revokeObjectURL(src);}
}

document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
 try{
 if(a==='close'){$('#'+b.dataset.target)?.close();return;}
 if(a==='cart'){showCart();return;}
 if(a==='product'){showProduct(id);return;}
 if(a==='filter'){filter=b.dataset.category;renderProducts();return;}
 if(a==='reset-search'){filter='Todos';query='';$('#search').value='';renderProducts();return;}
 if(a==='qty'){captureBuyer();const x=cart[Number(b.dataset.index)];if(x){x.qty=Math.max(0,Math.min(99,x.qty+Number(b.dataset.delta)));cart=cart.filter(x=>x.qty>0);saveCart();showCart();}return;}
 if(a==='remove'){captureBuyer();cart.splice(Number(b.dataset.index),1);saveCart();showCart();return;}
 if(a==='copy-order'){captureBuyer();await copyText(orderMessage(data,cart,buyer));return;}
 if(a==='select-message'){const t=$('#message-dialog textarea');t.focus();t.select();return;}
 if(a==='quote'){showQuote();return;}
 if(a==='admin-tab'){if(!ensureSaved())return;adminTab=b.dataset.tab;renderAdmin();return;}
 if(a==='preview'){if(!ensureSaved())return;const html=exportHtml('store'),url=URL.createObjectURL(new Blob([html],{type:'text/html'}));window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000);return;}
 if(a==='new-product'||a==='edit-product'){showEditor(a==='new-product'?null:id);return;}
 if(a==='duplicate-product'){const p=data.products.find(x=>x.id===id);data.products.push({...structuredClone(p),id:crypto.randomUUID?crypto.randomUUID():'mueble-'+Date.now(),name:p.name+' (copia)',active:false});persist();renderAdminProducts();return;}
 if(a==='toggle-product'){data.products.find(x=>x.id===id).active=!data.products.find(x=>x.id===id).active;persist();renderAdminProducts();return;}
 if(a==='delete-product'){const p=data.products.find(x=>x.id===id);if(confirm('¿Eliminar '+p.name+' del catálogo?')){data.products=data.products.filter(x=>x.id!==id);persist();renderAdminProducts();}return;}
 if(a==='remove-photo'){uploadImage='';$('#upload-preview').innerHTML=photo({name:'Sin foto',image:''});$('#photo-file').value='';return;}
 if(a==='add-delivery'){data.settings=readSettings();data.settings.deliveries.push({id:'entrega-'+Date.now(),name:'Nueva entrega',description:'',fee:null,address:true,enabled:true});dirty=true;renderSettings();return;}
 if(a==='delete-delivery'){const next=readSettings();if(next.deliveries.length<=1)throw Error('Conservá al menos una opción de entrega.');next.deliveries.splice(Number(b.dataset.index),1);data.settings=next;dirty=true;renderSettings();return;}
 if(a==='download-store'){if(!ensureSaved())return;download('index.html',exportHtml('store'),'text/html;charset=utf-8');return;}
 if(a==='download-admin'){if(!ensureSaved())return;download('administrar.html',exportHtml('admin'),'text/html;charset=utf-8');return;}
 if(a==='backup'){if(!ensureSaved())return;download('brava-catalogo-'+new Date().toLocaleDateString('sv-SE')+'.json',JSON.stringify(data,null,2),'application/json');return;}
 }catch(err){toast(err.message||'No se pudo completar. Revisá los datos.');}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;renderProducts();}if(e.target.closest('#settings-form'))dirty=true;});
document.addEventListener('change',async e=>{
 try{
 if(e.target.closest('#checkout-form')&&['payment','delivery'].includes(e.target.name)){captureBuyer();showCart();}
 if(e.target.id==='photo-file')await processPhoto(e.target.files[0]);
 if(e.target.id==='import-file'&&e.target.files[0]){
 const file=e.target.files[0];if(file.size>40*1024*1024)throw Error('La copia supera los 40 MB.');const next=validateData(JSON.parse(await file.text()));
 if(confirm('¿Reemplazar el catálogo y la configuración de este navegador por esta copia de Brava?')){data=next;persist();renderAdmin();}
 }
 }catch(err){toast(err.message||'No se pudo leer el archivo.');}
});
document.addEventListener('submit',e=>{
 const f=e.target;if(!['add-form','checkout-form','quote-form','product-form','settings-form'].includes(f.id))return;e.preventDefault();
 try{
 const v=new FormData(f);
 if(f.id==='add-form'){
 const p=data.products.find(x=>x.id===f.dataset.id),qty=Number(v.get('qty')),finish=String(v.get('finish')),note=String(v.get('note')||'').trim();if(!Number.isInteger(qty)||qty<1||qty>99)throw Error('Elegí una cantidad entre 1 y 99.');
 const item=cart.find(x=>x.id===p.id&&x.finish===finish&&x.note===note);if(item){if(item.qty+qty>99)throw Error('El máximo es de 99 unidades por selección.');item.qty+=qty;}else cart.push({id:p.id,qty,finish,note});
 saveCart();$('#product-dialog').close();showCart();return;
 }
 if(f.id==='checkout-form'){captureBuyer();if(!cart.length)throw Error('Agregá un mueble a tu pedido.');const message=orderMessage(data,cart,buyer),url=whatsappUrl(data.settings.whatsapp,message);if(url)window.open(url,'_blank','noopener,noreferrer');else showMessage(message);return;}
 if(f.id==='quote-form'){const message='Hola, Brava. Quiero consultar por un mueble a medida.\n\nNombre: '+String(v.get('name')).trim()+'\nMi idea: '+String(v.get('idea')).trim()+'\nMedidas aproximadas: '+String(v.get('dimensions')).trim()+'\n\n¿Podemos coordinar un presupuesto?',url=whatsappUrl(data.settings.whatsapp,message);if(url)window.open(url,'_blank','noopener,noreferrer');else{$('#quote-dialog').close();showMessage(message);}return;}
 if(f.id==='product-form'){
 const p={id:editingId||(crypto.randomUUID?crypto.randomUUID():'mueble-'+Date.now()),name:String(v.get('name')).trim(),category:String(v.get('category')).trim(),price:Number(v.get('price')),transferPrice:v.get('transferPrice')===''?null:Number(v.get('transferPrice')),dimensions:String(v.get('dimensions')).trim(),material:String(v.get('material')).trim(),description:String(v.get('description')).trim(),finishes:[...new Set(String(v.get('finishes')).split(',').map(s=>s.trim()).filter(Boolean))],leadTime:String(v.get('leadTime')).trim(),image:uploadImage,active:v.has('active')};
 const next=structuredClone(data),index=next.products.findIndex(x=>x.id===p.id);if(index<0)next.products.push(p);else next.products[index]=p;data=validateData(next);persist();$('#edit-dialog').close();renderAdminProducts();return;
 }
 if(f.id==='settings-form'){const next={...data,settings:readSettings()};data=validateData(next);persist();return;}
 }catch(err){toast(err.message||'No se pudo guardar. Revisá los datos.');}
});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
if(ADMIN){document.title='Administrar · BRAVA Herrería';renderAdmin();}else renderStore();
</script></body></html>
